[project]
name = "deepfinresearch"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "chromadb>=0.5",
    "openai>=1.30",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "tenacity>=8.3",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "black>=24.0", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: 需要真实 API Key 的端到端测试"]

[tool.ruff]
line-length = 100
